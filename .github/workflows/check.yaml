name: Check Docker configuration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --target runtime -t kld-visualization .
      - run: docker run --rm kld-visualization Rscript tests/smoke.R
